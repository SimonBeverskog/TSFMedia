name: Validate Sanity Studio

on:
  push:
    branches: [main]
    paths: ['studio-tsfmedia/**', 'sportfoto/src/**', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio-tsfmedia/**', 'sportfoto/src/**', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio-tsfmedia/package-lock.json
      - run: npm ci
        working-directory: studio-tsfmedia
      - run: npm ci
        working-directory: sportfoto
      - run: npm run check
        working-directory: studio-tsfmedia
      - run: npm run build -- --yes
        working-directory: studio-tsfmedia
